<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbfc" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>页面不存在 · 个人中转站</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fdfdfc;
        color: #5a4a3c;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: min(100%, 420px);
        text-align: center;
        padding: 40px 28px;
        border: 1px solid #ece5db;
        border-radius: 14px;
        background: #fffdf9;
        box-shadow: 0 12px 40px rgba(93, 85, 76, 0.08);
      }
      .code {
        display: block;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 56px;
        line-height: 1;
        color: #e3d6c8;
        letter-spacing: 0.06em;
      }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 24px; margin: 10px 0 8px; }
      p { font-size: 13px; line-height: 1.9; color: #8a7b6d; margin: 0 0 22px; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 9px;
        background: #4a3f35;
        color: #fffdf9;
        font-size: 13px;
        text-decoration: none;
      }
      a:hover { background: #362d25; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="code" aria-hidden="true">404</span>
      <h1>这一页走丢了</h1>
      <p>可能是链接写错了，或者它已经被收进抽屉里。</p>
      <a href="/">回到首页</a>
    </div>
  </body>
</html>
