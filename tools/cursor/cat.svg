<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBF7F1"/>
      <stop offset="1" stop-color="#EDE3D7"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD0EC"/>
      <stop offset="0.55" stop-color="#63AED6"/>
      <stop offset="1" stop-color="#3D86AE"/>
    </linearGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6A8B4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6A8B4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.85" stdDeviation="0.6" flood-color="#3A2E24" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#soft)" stroke-linejoin="round">
    <!-- 耳朵：外轮廓圆角三角 + 粉色内耳 -->
    <path d="M9.6 10.2 C8.3 7 6.6 3.6 6.2 3.1 C5.9 2.7 5.4 2.7 5.1 3.1 C4.3 4.2 3.4 6.4 3.1 8.2 C2.9 9.6 3.5 10.9 4.6 11.6 Z"
          fill="url(#fur)" stroke="#3E3228" stroke-width="1.4"/>
    <path d="M22.4 10.2 C23.7 7 25.4 3.6 25.8 3.1 C26.1 2.7 26.6 2.7 26.9 3.1 C27.7 4.2 28.6 6.4 28.9 8.2 C29.1 9.6 28.5 10.9 27.4 11.6 Z"
          fill="url(#fur)" stroke="#3E3228" stroke-width="1.4"/>
    <path d="M8.1 9.6 C7.3 7.4 6.4 5.4 6.2 5.2 C6.0 5.0 5.8 5.1 5.6 5.4 C5.2 6.2 4.7 7.6 4.6 8.6 C4.5 9.3 4.9 10 5.6 10.4 Z"
          fill="#F2A6B5"/>
    <path d="M23.9 9.6 C24.7 7.4 25.6 5.4 25.8 5.2 C26.0 5.0 26.2 5.1 26.4 5.4 C26.8 6.2 27.3 7.6 27.4 8.6 C27.5 9.3 27.1 10 26.4 10.4 Z"
          fill="#F2A6B5"/>

    <!-- 头：脸颊略宽、下巴收一点，不是正圆 -->
    <path d="M16 6.4 C22.7 6.4 28.2 10.9 28.2 17.3 C28.2 24 23.2 28.4 16 28.4 C8.8 28.4 3.8 24 3.8 17.3 C3.8 10.9 9.3 6.4 16 6.4 Z"
          fill="url(#fur)" stroke="#3E3228" stroke-width="1.45"/>

    <!-- 腮红 -->
    <ellipse cx="8.2" cy="20.6" rx="2.6" ry="1.9" fill="url(#blush)"/>
    <ellipse cx="23.8" cy="20.6" rx="2.6" ry="1.9" fill="url(#blush)"/>

    <!-- 眼睛：大一点才像猫；深色描边 + 天蓝虹膜 + 两颗高光 -->
    <ellipse cx="11.9" cy="17.2" rx="2.45" ry="2.85" fill="url(#iris)" stroke="#33424E" stroke-width="0.85"/>
    <ellipse cx="20.1" cy="17.2" rx="2.45" ry="2.85" fill="url(#iris)" stroke="#33424E" stroke-width="0.85"/>
    <ellipse cx="11.9" cy="17.6" rx="1.05" ry="1.75" fill="#26333D"/>
    <ellipse cx="20.1" cy="17.6" rx="1.05" ry="1.75" fill="#26333D"/>
    <circle cx="11.0" cy="15.8" r="0.95" fill="#FFFFFF"/>
    <circle cx="19.2" cy="15.8" r="0.95" fill="#FFFFFF"/>
    <circle cx="12.6" cy="18.9" r="0.45" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="20.8" cy="18.9" r="0.45" fill="#FFFFFF" opacity="0.75"/>

    <!-- 鼻子 -->
    <path d="M14.6 20.95 C15.2 20.35 16.8 20.35 17.4 20.95 C17.0 21.95 16.5 22.45 16 22.45 C15.5 22.45 15.0 21.95 14.6 20.95 Z"
          fill="#EE8FA2"/>

    <!-- 嘴：两撇，别太深 -->
    <path d="M16 22.4 C16 23.4 15.3 24.0 14.4 23.9" fill="none" stroke="#8A7767" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M16 22.4 C16 23.4 16.7 24.0 17.6 23.9" fill="none" stroke="#8A7767" stroke-width="0.8" stroke-linecap="round"/>

    <!-- 胡须：极细、浅，太粗会糊 -->
    <path d="M9.6 20.4 L4.6 19.6 M9.5 22.2 L4.8 22.9" fill="none" stroke="#B7A695" stroke-width="0.55" stroke-linecap="round" opacity="0.9"/>
    <path d="M22.4 20.4 L27.4 19.6 M22.5 22.2 L27.2 22.9" fill="none" stroke="#B7A695" stroke-width="0.55" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
