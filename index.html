<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbfc" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="一个安静的个人网站入口。" />
    <script>
      // 首帧前定主题：默认深色，用户手动切过就记住
      (function () {
        try {
          var t = localStorage.getItem('hub-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 小猫：头/身/闭眼/颈部柔影合成一张图，首屏只拉这一张 -->
    <link rel="preload" as="image" href="/cat/cat-sprite.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="个人中转站" />
    <meta property="og:description" content="一个安静的个人网站入口。" />
    <meta property="og:url" content="https://www.kuilab.cn/" />
    <meta name="twitter:card" content="summary" />
    <title>个人中转站</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
