<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 主题模块：浏览器/手机状态栏颜色跟着主题走，首帧前由下面的脚本写定 -->
    <meta name="theme-color" content="#1A1715" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="一个安静的个人网站入口。" />
    <script>
      // 首帧前定主题：默认深色，用户手动切过就记住
      (function () {
        // 季节色：只影响 accent 一族，跟着日历自己走，不用人工换肤
        var m = new Date().getMonth() + 1;
        document.documentElement.dataset.season =
          m === 12 || m <= 2 ? 'winter' : m <= 5 ? 'spring' : m <= 8 ? 'summer' : 'autumn';
        try {
          var t = localStorage.getItem('hub-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#F3EFE8' : '#1A1715');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
        // 入场动画只在首屏放一次：从子页面回来不该再把标题、卡片重放一遍
        document.documentElement.classList.add('enter');
        setTimeout(function () {
          document.documentElement.classList.remove('enter');
        }, 2400);
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Linda" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 首屏两张图：人像是 LCP，给它高优先级且先于脚本开始下载；小猫随后、低优先级 -->
    <link rel="preload" as="image" href="/images/portrait-linda.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/cat/cat-sprite.webp" fetchpriority="low" />
    <!-- 首页两处数据提前拉：和脚本并行，React 挂载时通常已经在缓存里，页面不会先空后满 -->
    <link rel="preload" href="/links.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="/now.json" as="fetch" crossorigin="anonymous" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Linda · kuilab" />
    <meta property="og:description" content="Linda：一个安静的个人网站入口，链接、近况、联络站与随身听。" />
    <meta property="og:url" content="https://www.kuilab.cn/" />
    <meta name="twitter:card" content="summary" />
    <title>Linda · kuilab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
